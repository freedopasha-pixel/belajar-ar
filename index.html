<!DOCTYPE html>
<html>
<head>
    <title>AR Alternatif Tanpa ARCore</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin : 0px; overflow: hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <a-assets>
            <a-asset-item id="pisang" src="https://raw.gcdn.cf/KhronosGroup/glTF-Sample-Models/master/2.0/Banana/glTF-Binary/Banana.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro">
            
            <a-entity gltf-model="#pisang"
                      position="0 0.5 0" 
                      scale="5 5 5"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
            </a-entity>
            
        </a-marker>

        <a-entity camera></a-entity>
        
    </a-scene>
</body>
</html>
